name: Uppdatera kurser och publicera

on:
  push:
    branches: [master]
    paths:
      - 'apps/borskompassen/**'
      - 'src/finance/data/**'
      - '.github/workflows/update-data.yml'
  schedule:
    # Tider i UTC, måndag till fredag
    - cron: '13 7 * * 1-5'   # morgon: gårdagens slutkurser
    - cron: '43 16 * * 1-5'  # efter Stockholmsbörsens stängning
    - cron: '17 21 * * 1-5'  # efter New York-börsens stängning
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: borskompassen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[data]' pytest
      - name: Kör testerna
        run: python -m pytest tests/test_borskompassen.py
      - name: Hämta kurser från Yahoo Finance
        id: fetch
        continue-on-error: true
        run: python apps/borskompassen/update_data.py
      - name: Spara ny data i repot
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apps/borskompassen/data/
          git diff --cached --quiet || git commit -m "Uppdatera kurser $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/borskompassen

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
