name: Uppdatera kurser och publicera

on:
  push:
    branches: [master]
    paths:
      - 'apps/borskompassen/**'
      - 'src/finance/data/**'
      - '.github/workflows/update-data.yml'
  schedule:
    # Tider i UTC, måndag till fredag
    - cron: '13 7 * * 1-5'   # morgon: gårdagens slutkurser
    - cron: '43 16 * * 1-5'  # efter Stockholmsbörsens stängning
    - cron: '17 21 * * 1-5'  # efter New York-börsens stängning
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: borskompassen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[data]' pytest
      - name: Kör testerna
        run: python -m pytest tests/test_borskompassen.py tests/test_borskompassen_universe.py
      - id: pages
        uses: actions/configure-pages@v5
      - name: Hämta förra publicerade kurser och listan över instrument
        # Med flera tusen instrument är kursfilen för stor för att sparas i repot vid varje
        # körning. Förra publicerade versionen är utgångsläget; saknas den används repots kopia.
        continue-on-error: true
        working-directory: apps/borskompassen
        run: |
          for file in data/quotes.json data/meta.json universe.json; do
            curl -fsSL --retry 3 "${{ steps.pages.outputs.base_url }}/$file" -o "$file.new" \
              && mv "$file.new" "$file" || rm -f "$file.new"
          done
      - name: Uppdatera listan över aktier och fonder (en gång i veckan)
        continue-on-error: true
        run: python apps/borskompassen/build_universe.py --max-age-days 7
      - name: Hämta kurser från Yahoo Finance
        continue-on-error: true
        run: python apps/borskompassen/update_data.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/borskompassen

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
