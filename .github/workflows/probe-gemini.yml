name: Tillfälligt - Gemini-kvot
on:
  push:
    branches: [claude/integrate-borskompassen-app-h83c12]
    paths: [.github/workflows/probe-gemini.yml]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          key = os.environ["GEMINI_API_KEY"]
          base = "https://generativelanguage.googleapis.com/v1beta/models"
          req = urllib.request.Request(f"{base}?pageSize=1000", headers={"x-goog-api-key": key})
          models = json.loads(urllib.request.urlopen(req).read())["models"]
          for m in models:
              if "generateContent" in m.get("supportedGenerationMethods", []) and ("flash" in m["name"] or "gemma" in m["name"]):
                  print("model", m["name"], m.get("displayName"))
          body = json.dumps({"contents": [{"role": "user", "parts": [{"text": "Svara med ordet hej."}]}]}).encode()
          for model in ["gemini-flash-latest", "gemini-flash-lite-latest", "gemini-2.5-flash-lite", "gemma-3-27b-it"]:
              req = urllib.request.Request(f"{base}/{model}:generateContent", data=body,
                                           headers={"Content-Type": "application/json", "x-goog-api-key": key})
              try:
                  out = json.loads(urllib.request.urlopen(req, timeout=60).read())
                  print("OK ", model, out.get("modelVersion"), out["candidates"][0]["content"]["parts"][0]["text"][:40])
              except urllib.error.HTTPError as exc:
                  print("ERR", model, exc.code, exc.read().decode()[:1500])
