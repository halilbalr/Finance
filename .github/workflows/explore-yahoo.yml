name: Undersök Yahoo (tillfällig)

on:
  push:
    branches: [claude/integrate-borskompassen-app-h83c12]
    paths: ['.github/explore/*.py', '.github/workflows/explore-yahoo.yml']

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[data]'
      - run: python .github/explore/explore_yahoo.py explore-out
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add explore-out
          git commit -m "Tillfälligt: resultat från Yahoo-undersökning"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
