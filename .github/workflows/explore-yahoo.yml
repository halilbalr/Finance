name: Undersök AI och nyheter (tillfällig)

on:
  push:
    branches: [claude/integrate-borskompassen-app-h83c12]
    paths: ['.github/explore/*.py', '.github/workflows/explore-yahoo.yml']

permissions:
  contents: write
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[data]'
      - name: GitHub Models
        continue-on-error: true
        run: python .github/explore/probe.py explore-out models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Kronos
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/halilbalr/Kronos kronos-src
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install einops huggingface_hub safetensors tqdm
          python .github/explore/probe.py explore-out kronos
      - name: Ollama
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) ; sleep 5
          ollama pull qwen2.5:3b && ollama pull qwen2.5:7b
          python .github/explore/probe.py explore-out ollama qwen2.5:3b qwen2.5:7b
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add explore-out
          git commit -m "Tillfälligt: resultat från Kronos, Ollama och GitHub Models"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
