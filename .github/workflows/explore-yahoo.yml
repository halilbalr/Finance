name: Provkör prognoser och nyheter (tillfällig)

on:
  push:
    branches: [claude/integrate-borskompassen-app-h83c12]
    paths: ['.github/workflows/explore-yahoo.yml']

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[data]' pytest
      - run: python -m pytest tests/test_borskompassen*.py
      - name: Hämta publicerade data
        working-directory: apps/borskompassen
        run: |
          for file in data/quotes.json data/meta.json universe.json data/briefs.json; do
            curl -fsSL --retry 3 "https://halilbalr.github.io/Finance/$file" -o "$file"
          done
      - name: Lista (ska byggas om på grund av ny version)
        run: python apps/borskompassen/build_universe.py --max-age-days 7
      - name: Kronos
        run: |
          python apps/borskompassen/forecast.py --due && echo due
          git clone --depth 1 https://github.com/halilbalr/Kronos kronos-src
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install einops huggingface_hub safetensors tqdm
          /usr/bin/time -v python apps/borskompassen/forecast.py 2>&1 | grep -E "Klart|fel|Elapsed|Error" | head -40
      - run: /usr/bin/time -v python apps/borskompassen/details.py 2>&1 | grep -E "Klart|fel|Elapsed" | head -40
      - run: python apps/borskompassen/ai.py
      - run: |
          mkdir -p explore-out/trial
          D=apps/borskompassen/data
          cp $D/forecasts.json $D/headlines.json explore-out/trial/
          cp $D/detail/volv-b.json $D/detail/nvda.json $D/detail/saab-b.json $D/detail/eric-b.json explore-out/trial/
          ls $D/detail | wc -l > explore-out/trial/count.txt; du -sh $D/detail >> explore-out/trial/count.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add explore-out/trial
          git commit -m "Tillfälligt: provkörning av prognoser och nyheter"
          git checkout -- apps/borskompassen
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
