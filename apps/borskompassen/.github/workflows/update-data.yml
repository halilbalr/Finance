name: Uppdatera kurser och publicera

on:
  push:
    branches: [main]
  schedule:
    # Tider i UTC, måndag till fredag
    - cron: '13 7 * * 1-5'   # morgon: gårdagens slutkurser
    - cron: '43 16 * * 1-5'  # efter Stockholmsbörsens stängning
    - cron: '17 21 * * 1-5'  # efter New York-börsens stängning
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: borskompassen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kör testerna
        run: npm test
      - name: Hämta kurser från Yahoo Finance
        id: fetch
        continue-on-error: true
        run: npm run update
      - name: Spara ny data i repot
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Uppdatera kurser $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
