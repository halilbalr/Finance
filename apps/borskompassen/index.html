<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Håll koll på dina aktier och fonder, få signaler, larm och förklaringar av hur världshändelser påverkar dina innehav.">
<meta name="theme-color" content="#7a2e6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Börskompassen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Börskompassen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: an app shell. Wide screens get a quiet inset sidebar plus a content column; phones get a sticky top bar and a bottom tab bar. Plum is the one accent; green/red only ever mean up/down. */
:root{
  --bg:#f1f2ee; --surface:#ffffff; --surface-2:#e8eae4; --ink:#16201b; --ink-2:#47524c; --muted:#6e7872; --line:#dcdfd8;
  --accent:#7a2e6b; --accent-ink:#ffffff; --accent-soft:#f3e5ef; --accent-line:#e2c6da;
  --up:#0b7a35; --up-soft:#e2f2e7; --down:#c2362f; --down-soft:#fae7e5; --warn:#8f5b00; --warn-soft:#faefd6;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --grid:#e5e7e1; --ring:#ffffff;
  --font-display:"Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-xs:.8125rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.1875rem; --t-xl:1.5rem; --t-2xl:2rem; --t-3xl:2.5rem;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1311; --surface:#161c19; --surface-2:#202723; --ink:#edf0eb; --ink-2:#b8c0ba; --muted:#8c958f; --line:#2a322e;
  --accent:#e29ad2; --accent-ink:#22121e; --accent-soft:#38202f; --accent-line:#5a3550;
  --up:#45c46f; --up-soft:#14281b; --down:#f27d73; --down-soft:#341a18; --warn:#e3aa45; --warn-soft:#33270f;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --grid:#242b27; --ring:#161c19;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161c19; --surface-2:#202723; --ink:#edf0eb; --ink-2:#b8c0ba; --muted:#8c958f; --line:#2a322e;
  --accent:#e29ad2; --accent-ink:#22121e; --accent-soft:#38202f; --accent-line:#5a3550;
  --up:#45c46f; --up-soft:#14281b; --down:#f27d73; --down-soft:#341a18; --warn:#e3aa45; --warn-soft:#33270f;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --grid:#242b27; --ring:#161c19;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:var(--t-md);line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:var(--t-2xl);font-weight:700}
h2{font-size:var(--t-lg);font-weight:600}
h3{font-size:var(--t-md);font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:var(--t-sm)} .xs{font-size:var(--t-xs)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:18px;height:18px}

/* ---------- shell ---------- */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:var(--t-lg);color:var(--ink);text-decoration:none;letter-spacing:-.015em}
.brand .mark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px}
.topbar .brand{margin-right:auto}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.badge{position:absolute;top:5px;right:4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--down);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--font-body)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
.tabbar a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
main{min-width:0;padding-block:20px 104px}
@media (min-width:900px){
  .shell{grid-template-columns:236px minmax(0,1fr);gap:32px}
  .topbar,.tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(16px + env(safe-area-inset-top, 0px));align-self:start;
    max-height:calc(100dvh - 32px);margin-block:16px;padding:18px 12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:auto}
  .side .brand{padding:0 8px 16px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--ink-2);text-decoration:none;font-weight:600}
  .side nav a:hover{background:var(--surface-2);color:var(--ink)}
  .side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .side nav a .badge{position:static;margin-left:auto}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px 4px 0;border-top:1px solid var(--line)}
  main{padding-block:28px 64px}
}
.content{max-width:1080px}
main:focus{outline:none}
[data-act="ask"]{display:none!important}

/* ---------- common blocks ---------- */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.phead .sub{color:var(--ink-2);margin-top:6px;max-width:62ch}
.phead .actions{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card > h2{margin-bottom:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1000px){.grid2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}}
@media (max-width:999px){.reflow > .stack{display:contents}}
.eyebrow{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--down);border-color:var(--down-soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:var(--t-sm);border-radius:9px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:var(--t-sm);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:var(--t-xs);font-weight:700;white-space:nowrap;line-height:1.5}
.pill.buy,.pill.buy2,.pill.up{background:var(--up-soft);color:var(--up)}
.pill.sell,.pill.sell2,.pill.down{background:var(--down-soft);color:var(--down)}
.pill.hold,.pill.flat{background:var(--surface-2);color:var(--ink-2)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.demo{background:var(--warn-soft);color:var(--warn)}
.term{background:none;border:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--accent);text-underline-offset:3px;cursor:help}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:6px 0}
.empty p{color:var(--ink-2);max-width:56ch}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:var(--t-sm)}
.note strong{color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.note.warn .icon{color:var(--warn)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;margin-bottom:18px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:var(--t-sm)}
.banner b{color:var(--warn)}
.skel{height:14px;border-radius:7px;background:var(--surface-2);margin:8px 0}
.disclaimer{font-size:var(--t-xs);color:var(--muted);margin-top:12px}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

/* ---------- numbers & summary ---------- */
.big{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--t-3xl);font-weight:600;letter-spacing:-.03em;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:760px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:759px){.stats > .stat:last-child:nth-child(odd){grid-column:1 / -1}}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--t-lg);font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.stat .l{font-size:var(--t-xs);color:var(--muted);font-weight:600}
.delta{display:inline-flex;align-items:baseline;gap:4px;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- lists ---------- */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.rows > .row:first-child{border-top:none}
a.row:hover{background:var(--surface-2);border-radius:10px}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:var(--t-xs);color:var(--muted)}
.row .right{text-align:right}
.mrow{grid-template-columns:28px minmax(0,1fr) auto}
@media (min-width:640px){.mrow{grid-template-columns:28px minmax(0,1.4fr) 100px minmax(92px,auto) 84px 104px}}
.mrow .scell,.mrow .pcell,.mrow .ccell{display:none}
@media (min-width:640px){.mrow .scell,.mrow .pcell,.mrow .ccell{display:block}.mrow .mob{display:none}}
.star{width:28px;height:28px;border:none;background:none;padding:0;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}
.spark{width:100px;height:30px}
.hrow{grid-template-columns:minmax(0,1fr) auto}
@media (min-width:760px){.hrow{grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(80px,1fr)) 64px}}
.hrow .dcell{display:none}
@media (min-width:760px){.hrow .dcell{display:block;text-align:right}.hrow .mob{display:none}}
.thead{font-size:var(--t-xs);color:var(--muted);font-weight:700;padding-block:4px 8px;border-top:none}
@media (max-width:759px){.hrow.thead{display:none}}
@media (max-width:639px){.mrow.thead{display:none}}
.trow{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.trow .acts{display:flex;gap:2px}
.side-pill{min-width:46px;justify-content:center}

/* ideas / notifications */
.idea{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.idea:first-child{border-top:none;padding-top:2px}
.tone{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px}
.tone.up{background:var(--up-soft);color:var(--up)}
.tone.down{background:var(--down-soft);color:var(--down)}
.tone.warn{background:var(--warn-soft);color:var(--warn)}
.tone.info{background:var(--accent-soft);color:var(--accent)}
.idea h3{font-family:var(--font-body);font-weight:700;font-size:var(--t-md);line-height:1.35}
.idea p{color:var(--ink-2);font-size:var(--t-sm);margin-top:3px}
.idea .unread{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}

/* signal meter */
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 6px}
.meter span{height:10px;border-radius:5px;background:var(--surface-2)}
.meter span.on.l-2,.meter span.on.l-1{background:var(--down)}
.meter span.on.l0{background:var(--ink-2)}
.meter span.on.l1,.meter span.on.l2{background:var(--up)}
.meter-l{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--muted)}
.siglabel{font-family:var(--font-display);font-size:var(--t-xl);font-weight:700}
.factor{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.factor .fi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}
.factor .fi.p{background:var(--up-soft);color:var(--up)} .factor .fi.n{background:var(--down-soft);color:var(--down)} .factor .fi.z{background:var(--surface-2);color:var(--ink-2)}
.factor b{display:block}
.factor p{font-size:var(--t-sm);color:var(--ink-2)}
.factor .det{font-family:var(--font-num);font-size:var(--t-xs);color:var(--muted);margin-top:2px}

/* charts */
.chart{position:relative;width:100%;min-height:120px;touch-action:pan-y;user-select:none}
.chart svg{display:block;overflow:visible}
.c-grid{stroke:var(--grid);stroke-width:1}
.c-tick{fill:var(--muted);font-size:11.5px;font-family:var(--font-num)}
.c-cross{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.c-dot{stroke:var(--ring);stroke-width:2}
.c-tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:9px;padding:7px 10px;font-size:var(--t-xs);line-height:1.4;white-space:nowrap;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.c-tip .tv{font-family:var(--font-num);font-weight:600}
.c-tip i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:var(--t-xs);color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ring);box-shadow:0 0 0 1px var(--line)}
.ranges{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.ranges button{border:none;background:transparent;border-radius:8px;min-height:32px;padding:0 11px;font-weight:700;font-size:var(--t-sm);color:var(--ink-2);cursor:pointer}
.ranges button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:var(--t-sm)}
.bar .track{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--series-1)}

/* world */
.mood{display:inline-flex;align-items:center;gap:8px}
.wi{border-top:1px solid var(--line)}
.wi:first-of-type{border-top:none}
.wi > summary{list-style:none;cursor:pointer;padding:14px 0;display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:12px;align-items:start}
.wi > summary::-webkit-details-marker{display:none}
.wi > summary h3{font-size:var(--t-lg);line-height:1.3}
.wi > summary .chev{transition:transform .2s}
.wi[open] > summary .chev{transform:rotate(180deg)}
.wi .body{padding:0 0 18px;display:flex;flex-direction:column;gap:14px}
.wi .body p{max-width:70ch}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain .st{padding:6px 11px;border-radius:9px;background:var(--surface-2);font-size:var(--t-sm);font-weight:600}
.chain .ar{color:var(--muted);font-weight:700}
.imp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:baseline}
.imp .pill{justify-self:start}
.imp p{font-size:var(--t-sm);color:var(--ink-2)}
.imp .mine{font-size:var(--t-xs);font-weight:700;color:var(--accent)}
.srcs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--t-xs)}
.cal{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cal:first-child{border-top:none}
.cal .d{font-family:var(--font-num);text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:5px 0;line-height:1.1;align-self:start}
.cal .d b{display:block;font-size:var(--t-lg)}
.cal .d span{font-size:11px;text-transform:uppercase;font-weight:700}

/* simulator */
.evchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.evchips .chip{flex:none}
.simgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){.simgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.simcol{border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.simcol h3{font-size:var(--t-sm);margin-bottom:6px;font-family:var(--font-body);font-weight:700}
.simcol ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.simcol li{font-size:var(--t-sm)}
.simcol li b{display:block;font-size:var(--t-md)}
.simcol li span{color:var(--ink-2)}
.rules{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rule{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.rule .tone{width:30px;height:30px;font-size:13px}
.rule p{font-size:var(--t-sm);color:var(--ink-2)}
.gl{padding:12px 0;border-top:1px solid var(--line)}
.gl:first-child{border-top:none}
.gl b{font-size:var(--t-md)}
.gl p{color:var(--ink-2);font-size:var(--t-sm);max-width:70ch}

/* forms & dialog */
dialog{border:none;border-radius:18px;padding:0;width:min(560px, calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:auto}
dialog::backdrop{background:rgba(8,12,10,.5)}
.form{display:flex;flex-direction:column;gap:14px;padding:22px}
.form h2{font-size:var(--t-xl)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > span{font-size:var(--t-sm);font-weight:700;color:var(--ink-2)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:var(--t-xs);color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:grid;place-items:center;min-height:42px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg input:checked + label{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg input:focus-visible + label{outline:3px solid var(--accent)}
#side-kop:checked + label{color:var(--up)} #side-salj:checked + label{color:var(--down)}
.f-sum{font-size:var(--t-sm);color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.f-err{font-size:var(--t-sm);color:var(--down);font-weight:600}
.f-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
.modesw{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:11px;padding:3px}
.modesw button{border:none;background:transparent;min-height:36px;border-radius:8px;font-weight:700;font-size:var(--t-sm);color:var(--ink-2);cursor:pointer}
.modesw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* help drawer */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(460px, 100vw);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);padding-right:env(safe-area-inset-right, 0px)}
.dr-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.dr-head h2{font-size:var(--t-xl);margin-right:auto}
.dr-tabs{display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.dr-tabs button{flex:none;border:none;background:transparent;min-height:38px;padding:0 12px;border-radius:9px;font-weight:700;font-size:var(--t-sm);color:var(--ink-2);cursor:pointer}
.dr-tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.dr-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.dr-body ol,.dr-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
.faq{border-top:1px solid var(--line)}
.faq:first-child{border-top:none}
.faq summary{cursor:pointer;padding:12px 0;font-weight:700}
.faq p{padding-bottom:12px;color:var(--ink-2);font-size:var(--t-sm)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;font-size:var(--t-sm);line-height:1.5;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.a p + p,.msg.a ul{margin-top:8px}
.msg.a ul{padding-left:18px}
.msg .err{color:var(--down);font-weight:600;margin-top:6px}
.chatbox{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.chatbox textarea{flex:1;min-height:46px;max-height:140px;resize:none;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--ink-2)}
.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.pop{position:fixed;z-index:60;max-width:min(320px, calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:var(--t-sm);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pop b{display:block;margin-bottom:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom, 0px));z-index:70;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:var(--t-sm);max-width:calc(100vw - 32px)}
@media (min-width:900px){.toast{bottom:28px}}
.tour{padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px}
.tour .ill{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tour .ill svg{width:30px;height:30px}
.tour h2{font-size:var(--t-xl)}
.tour p{color:var(--ink-2)}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:4px}
.choice{display:grid;grid-template-columns:1fr;gap:10px}
.choice button{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.choice button:hover{border-color:var(--accent)}
.choice b{display:block;font-size:var(--t-md)}
.choice span{font-size:var(--t-sm);color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Huvudmeny">
    <a class="brand" href="#hem"><span class="mark" id="mk1"></span>Börskompassen</a>
    <nav id="sidenav"></nav>
    <div class="foot">
      <div>
        <div class="eyebrow" style="margin:0 4px 6px">Visa</div>
        <div class="modesw" id="modesw1"></div>
      </div>

    </div>
  </aside>
  <div style="min-width:0">

      <a class="iconbtn" href="#larm" aria-label="Larm och notiser" id="bell"></a>
      <button class="iconbtn" data-act="help" aria-label="Hjälp"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2-2.4 3.6"/><path d="M12 17.2v.1"/></svg></button>
    </header>
    <main id="main" class="content" tabindex="-1"></main>

</div>
<nav class="tabbar" id="tabbar" aria-label="Huvudmeny"></nav>
<dialog id="dlg"></dialog>
<div id="helpwrap" hidden>

</div>
<div class="pop" id="pop" hidden role="tooltip"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>

const NF = {};
const nf = d => NF[d] || (NF[d] = new Intl.NumberFormat('sv-SE', { minimumFractionDigits: d, maximumFractionDigits: d }));
const fmt = (v, d = 2) => (v == null || !isFinite(v)) ? '–' : nf(d).format(v);

const LS_KEY = 'borskompassen:v1';
const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch { return null; } };

const Store = {
  mode: 'local',
  async init() {
    this.useLocal();
    await this.loadMarket();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - (this.loadedAt || 0) > 15 * 60 * 1000) this.loadMarket(); });
  },
  async loadMarket() {
    const get = n => fetch(`data/${n}.json`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
    const [q, m, b, c] = await Promise.all(['quotes', 'meta', 'briefs', 'calendar'].map(get));
    if (q && Array.isArray(q.quotes)) {
      S.quotes = Object.fromEntries(q.quotes.map(x => [x.id, x]));
      S.meta = m || {}; S.briefs = (b?.briefs || []).slice().sort((x, y) => (y.date || '').localeCompare(x.date || ''));
      S.calendar = c?.events || []; S.marketErr = false; this.loadedAt = Date.now();
    } else S.marketErr = true;
    S.ready.market = true; invalidate(); schedRender();
  },
  useLocal() {
    const o = lsRead() || {};
    S.trades = o.trades || []; S.alerts = o.alerts || [];
    S.settings = { ...clone(DEFAULT_SETTINGS), ...(o.settings || {}) };
    S.ready.user = true; S.settingsLoaded = true; maybeTour();
  },
  saveLocal() { if (!lsWrite({ trades: S.trades, alerts: S.alerts, settings: S.settings })) toast('Webbläsaren tillåter inte att appen sparar. Ändringen gäller bara tills du stänger sidan.'); },
  async put(kind, obj) {
    const list = kind === 'trades' ? S.trades : S.alerts;
    const k = list.findIndex(x => x.id === obj.id); if (k >= 0) list[k] = obj; else list.push(obj);
    invalidate(); schedRender(); this.saveLocal();
  },
  async del(kind, id) {
    if (kind === 'trades') S.trades = S.trades.filter(x => x.id !== id); else S.alerts = S.alerts.filter(x => x.id !== id);
    invalidate(); schedRender(); this.saveLocal();
  },
  settings(patch) { Object.assign(S.settings, patch); invalidate(); schedRender(); this.saveLocal(); },
  exportData() {
    const blob = new Blob([JSON.stringify({ app: 'borskompassen', version: 1, exportedAt: new Date().toISOString(), trades: S.trades, alerts: S.alerts, settings: S.settings }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `borskompassen-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Säkerhetskopian är nedladdad.');
  },
  async importData(file) {
    try {
      const o = JSON.parse(await file.text());
      if (o.app !== 'borskompassen' || !Array.isArray(o.trades)) throw new Error();
      S.trades = o.trades; S.alerts = o.alerts || []; S.settings = { ...clone(DEFAULT_SETTINGS), ...(o.settings || {}), tourDone: true };
      this.saveLocal(); invalidate(); schedRender(); toast(`Läste in ${o.trades.length} affärer.`);
    } catch { toast('Filen kunde inte läsas. Välj en säkerhetskopia från Börskompassen.'); }
  },
};

let SIG = new Map(); const DATEIDX = new Map();
function invalidate() { SIG = new Map(); DATEIDX.clear(); }
const allInst = () => [...Object.values(S.quotes), ...(S.settings.custom || []).map(c => ({ ...c, custom: true }))];
const inst = id => S.quotes[id] || ((S.settings.custom || []).find(c => c.id === id) ? { ...(S.settings.custom.find(c => c.id === id)), custom: true } : null);
const FX_DEFAULT = { SEK: 1, USD: 9.55, NOK: 0.94, EUR: 11.0 };
const fx = cur => S.meta?.fx?.[cur] ?? FX_DEFAULT[cur] ?? 1;
function priceOf(i) {
  const o = S.settings.overrides?.[i.id];
  if (o && (i.demo || i.custom || !i.date || o.date >= i.date)) return { price: o.price, date: o.date, own: true };
  return { price: i.price, date: i.date, own: !!i.custom };
}
function dayChange(i) { const p = priceOf(i); if (p.own || !i.prevClose) return null; return (i.price / i.prevClose - 1) * 100; }
function closeOn(i, d) {
  if (!i) return null;
  const h = i.history;
  if (!h || !h.dates) return priceOf(i).price;
  let m = DATEIDX.get(i.id); if (!m) { m = new Map(h.dates.map((x, k) => [x, k])); DATEIDX.set(i.id, m); }
  const k = m.get(d); if (k != null) return h.close[k];
  let lo = 0, hi = h.dates.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (h.dates[mid] <= d) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans >= 0 ? h.close[ans] : null;

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });
function spark(values, up) {
  if (!values || values.length < 2) return '<svg class="spark" aria-hidden="true"></svg>';
  const mn = Math.min(...values), mx = Math.max(...values), n = values.length, W = 100, H = 30;
  const pts = values.map((v, i) => [i / (n - 1) * (W - 4) + 2, mx === mn ? H / 2 : 3 + (1 - (v - mn) / (mx - mn)) * (H - 6)]);
  const last = pts[n - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${pathD(pts)}" style="fill:none;stroke:var(--${up ? 'up' : 'down'});stroke-width:1.6;stroke-linejoin:round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" style="fill:var(--${up ? 'up' : 'down'})"/></svg>`;
}
const RANGES = { '1M': 21, '3M': 63, '6M': 126, '1Å': 260 };
const rangeBtns = (cur, act) => `<div class="ranges" role="group" aria-label="Tidsperiod">${Object.keys(RANGES).map(r => `<button type="button" data-act="${act}" data-r="${r}" aria-pressed="${r === cur}">${r}</button>`).join('')}</div>`;
const compactKr = v => Math.abs(v) >= 100000 ? fmt(v / 1000, 0) + ' tkr' : fmt(v, 0) + ' kr';

function demoBanner() {
  if (!S.meta?.pricesDemo) return S.meta?.pricesUpdatedAt ? `<p class="xs muted" style="margin:-8px 0 16px">Kurser från Yahoo Finance, fördröjda. Hämtade ${esc(new Date(S.meta.pricesUpdatedAt).toLocaleString('sv-SE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}.</p>` : '';
  return `<div class="banner" role="note"><b>Exempelkurser</b><span>Kurserna och graferna är påhittade tills riktiga kurser har hämtats från Yahoo Finance (npm run update).</span><button class="linkbtn" data-act="help" data-tab="faq">Läs mer</button></div>`;
}
function marketState() {
  if (S.marketErr) return `<div class="card empty"><h2>Kursdata kunde inte laddas</h2><p>Appen hittar inte filen data/quotes.json. Öppna appen via en webbserver (npm start) i stället för att dubbelklicka på filen, och kör npm run update för att hämta kurser.</p></div>`;
  if (!S.ready.market) return `<div class="card">${S.marketSlow ? '<p class="ink2">Kurserna dröjer. Det kan vara anslutningen. Sidan fortsätter att försöka.</p>' : ''}<div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div>`;
  return '';
}
function phead(title, sub, actions = '') { return `<div class="phead"><div><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`; }
const delta = (v, txt) => `<span class="delta ${cls(v)}">${arrow(v)} ${txt}</span>`;
function ideaRow(o, extra = '') {
  const sym = { up: '▲', down: '▼', warn: '!', info: 'i' }[o.tone] || 'i';
  const href = o.id ? `#aktie-${o.id}` : o.link ? `#${o.link}` : null;
  return `<div class="idea"><span class="tone ${o.tone}" aria-hidden="true">${sym}</span><div><h3>${o.unread ? '<span class="unread" title="Oläst"></span>' : ''}${esc(o.title)}</h3><p>${esc(o.text)}</p>${href ? `<p><a href="${href}">${o.id ? 'Visa ' + esc(inst(o.id)?.name || '') : 'Läs mer'}</a>${o.link && o.id ? ` · <a href="#${o.link}">Läs analysen</a>` : ''}</p>` : ''}${extra}</div></div>`;
}
function emptyPortfolio() {
  return `<div class="empty"><span class="eyebrow">Din portfölj</span><h2>Lägg in din första affär</h2><p>Skriv in vad du har köpt eller sålt, så räknar appen ut värde, vinst och risk åt dig. Vill du först se hur det fungerar kan du prova med en exempelportfölj som du sedan tar bort med en knapptryckning.</p><div class="chips"><button class="btn primary" data-act="trade-new">${ico('plus', 'icon sm')}Ny affär</button><button class="btn" data-act="example-load">Prova med exempel</button></div></div>`;
}
function moodPill(b) { const t = { positiv: 'up', negativ: 'down', forsiktig: 'warn' }[b.mood] || 'info'; return `<span class="pill ${t}">${esc(b.moodText || 'Läget')}</span>`; }
function mineInSector(sector) { return (S.P?.open || []).filter(h => h.i?.sector === sector).map(h => h.name); }
function calRows(limit) {
  const t = todayISO(); const ev = (S.calendar || []).filter(e => e.date >= t).slice(0, limit || 99);
  if (!ev.length) return '<p class="muted small">Inga inlagda händelser framåt.</p>';
  return ev.map(e => { const d = dt(e.date); return `<div class="cal"><div class="d"><b>${d.getDate()}</b><span>${d.toLocaleDateString('sv-SE', { month: 'short' }).replace('.', '')}</span></div><div><b>${esc(e.title)}</b><p class="small ink2">${esc(e.why)}</p></div></div>`; }).join('');
}

    <div class="actions"><button class="btn ${W ? '' : ''}" data-act="watch" data-inst="${esc(i.id)}" aria-pressed="${W}">${ico('star', 'icon sm')}${W ? 'Bevakas' : 'Bevaka'}</button><button class="btn" data-act="alert-new" data-inst="${esc(i.id)}">${ico('bell', 'icon sm')}Larm</button><button class="btn" data-act="price-set" data-inst="${esc(i.id)}">Ange kurs</button><button class="btn primary" data-act="trade-new" data-inst="${esc(i.id)}">${ico('plus', 'icon sm')}Registrera affär</button></div></div>`;
  // chart
  const c = i.history?.close;
  let chartCard = '';
  if (c && c.length > 5) {
    const n = Math.min(RANGES[S.ui.range], c.length), s0 = c.length - n, dates = i.history.dates.slice(s0);
    const series = [{ name: 'Kurs', values: c.slice(s0), color: 'var(--series-1)', area: !adv() }];
    if (adv()) { series.push({ name: 'MA50', values: smaSeries(c, 50).slice(s0), color: 'var(--series-2)', w: 1.6 }); series.push({ name: 'MA200', values: smaSeries(c, 200).slice(s0), color: 'var(--series-3)', w: 1.6 }); }
    const idx = new Map(dates.map((d, k) => [d, k]));
    const markers = S.trades.filter(t => t.inst === i.id && t.date >= dates[0]).map(t => { let k = idx.get(t.date); if (k == null) { k = dates.findIndex(d => d > t.date); if (k < 0) k = dates.length - 1; } return { i: k, v: +t.price, kind: t.side, label: `${fmt(+t.qty, 0)} st à ${fmtCur(+t.price, i.currency)}` }; });
    const chg = (c[c.length - 1] / c[s0] - 1) * 100;
    const yf = v => fmt(v, decFor(v));
    chartCard = `<section class="card"><div class="card-head"><div><h2>Kursen</h2><p class="small" style="margin-top:2px">${delta(chg, fmtPct(chg))} <span class="muted">under perioden</span></p></div>${rangeBtns(S.ui.range, 'range')}</div>
      ${chartBox('px', { dates, series, markers, h: 240, fmtY: yf, fmtTip: v => fmtCur(v, i.currency), label: 'Kursgraf för ' + i.name })}
      <div class="legend">${series.length > 1 ? series.map(s => `<span><i style="background:${s.color}"></i>${s.name === 'Kurs' ? 'Kurs' : s.name === 'MA50' ? term('ma', 'MA50') : term('ma', 'MA200')}</span>`).join('') : ''}${markers.length ? '<span><i class="dot" style="background:var(--up)"></i>Ditt köp</span><span><i class="dot" style="background:var(--down)"></i>Din försäljning</span>' : ''}${i.demo ? '<span class="muted">Exempelkurser</span>' : ''}</div></section>`;
  } else chartCard = `<section class="card"><h2>Kursen</h2><p class="ink2">Det finns ingen kurshistorik för ${esc(i.name)}, så graf och tekniska signaler saknas. Uppdatera kursen med "Ange kurs" när du vill.</p></section>`;
  // signal
  let sigCard;
  if (sg.level == null) sigCard = `<section class="card"><h2>Signal</h2><p class="ink2">Signaler kräver kurshistorik för minst tre månader.</p>${sg.factors.map(factorRow).join('')}</section>`;
  else {
    const L = LEVELS[sg.level];
    sigCard = `<section class="card"><div class="card-head"><h2>${term('signal', 'Signal')}</h2><button class="linkbtn small" data-act="ask" data-q="${esc('Förklara signalen för ' + i.name + ' med enkla ord. Vad betyder den för mig?')}">Fråga Claude</button></div>
      <div class="siglabel ${L.tone === 'info' ? '' : L.tone}">${L.label}</div>
      <div class="meter" aria-hidden="true">${[-2, -1, 0, 1, 2].map(l => `<span class="l${l} ${l === sg.level ? 'on' : ''}"></span>`).join('')}</div>
      <div class="meter-l"><span>Sälj</span><span>Avvakta</span><span>Köp</span></div>
      <h3 style="margin:16px 0 4px">Därför</h3>${sg.factors.map(factorRow).join('')}
      <p class="disclaimer">Signalen är en sammanvägning av regler${i.demo ? ' och bygger här på exempelkurser' : ''}. Den är inget råd och kan slå fel.</p></section>`;
  }
  // holding
  let hold = '';
  if (h) {
    const idea = ideas().filter(o => o.id === i.id);
    hold = `<section class="card"><h2>Ditt innehav</h2><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><div class="l">Antal</div><div class="v">${fmt(h.qty, h.qty % 1 ? 2 : 0)} st</div></div><div class="stat"><div class="l">${term('gav', 'GAV')}</div><div class="v">${fmtCur(h.avg, h.cur)}</div></div><div class="stat"><div class="l">Värde</div><div class="v">${fmtKr(h.valueSek)}</div></div><div class="stat"><div class="l">Vinst</div><div class="v ${cls(h.unrealSek)}">${signKr(h.unrealSek)}</div><div class="xs ${cls(h.unrealSek)}">${fmtPct(h.unrealPct)}</div></div></div>${idea.length ? `<div style="margin-top:8px">${idea.map(o => ideaRow({ ...o, id: null, link: null })).join('')}</div>` : ''}</section>`;
  }
  // world
  const hits = impactsFor(i), b = latestBrief();
  const world = `<section class="card"><h2>Omvärlden just nu</h2>${hits.length ? hits.map(({ item, im }) => `<div class="idea"><span class="tone ${im.dir > 0 ? 'up' : im.dir < 0 ? 'down' : 'info'}" aria-hidden="true">${im.dir > 0 ? '▲' : im.dir < 0 ? '▼' : '•'}</span><div><h3>${esc(item.title)}</h3><p>${esc(im.why)}</p><p><a href="#omvarld">Läs analysen</a></p></div></div>`).join('') : `<p class="ink2 small">${b ? `Dagens analys (${fmtDate(b.date)}) nämner inget som direkt berör ${esc(i.sector.toLowerCase())}.` : 'Ingen omvärldsanalys är inlagd ännu.'}</p>`}</section>`;
  // sensitivities
  const sens = EVENTS.map(ev => ({ ev, e: effectOf(ev, i) })).filter(x => x.e && x.e[0] !== 0 && !ev_isCompany(x.ev)).sort((a, b) => Math.abs(b.e[0]) - Math.abs(a.e[0])).slice(0, 6);
  const sensCard = `<section class="card"><h2>Så brukar ${esc(i.name)} påverkas</h2><p class="small ink2" style="margin-bottom:6px">Vad som brukar hända med ${esc(i.sector.toLowerCase())} när något av det här inträffar.</p>${sens.length ? sens.map(({ ev, e }) => `<div class="factor"><span class="fi ${e[0] > 0 ? 'p' : 'n'}" aria-hidden="true">${e[0] > 0 ? '▲' : '▼'}</span><div><b>${esc(ev.name)}: ${e[0] > 0 ? 'brukar gynnas' : 'brukar missgynnas'}${Math.abs(e[0]) >= 2 ? ' tydligt' : ''}</b><p>${esc(e[1])}</p></div></div>`).join('') : '<p class="ink2 small">Ingen tydlig koppling i appens händelsebibliotek.</p>'}<p style="margin-top:10px"><a href="#lar">Prova fler händelser i "Vad händer om …?"</a></p></section>`;
  // about
  const kv = [];
  if (i.high52 != null) kv.push(['Högsta 52 veckor', fmtCur(i.high52, i.currency)], ['Lägsta 52 veckor', fmtCur(i.low52, i.currency)]);
  if (i.dividendYield != null) kv.push([term('direktavkastning', 'Direktavkastning'), fmtPct(i.dividendYield, 1, false)]);
  if (adv() && i.pe != null) kv.push([term('pe', 'P/E-tal'), fmt(i.pe, 1)]);
  if (adv() && sg.rsi != null) kv.push([term('rsi', 'RSI (14 dagar)'), fmt(sg.rsi, 0)]);
  const about = `<section class="card"><h2>Om ${esc(i.name)}</h2>${i.about ? `<p class="ink2">${esc(i.about)}</p>` : '<p class="ink2">Egen aktie eller fond som du har lagt till.</p>'}${kv.length ? `<div class="rows" style="margin-top:10px">${kv.map(([k, v]) => `<div class="row"><span class="ink2">${k}</span><span class="num">${v}</span></div>`).join('')}</div>` : ''}${!adv() && (i.pe != null) ? '<p class="xs muted" style="margin-top:8px">Fler nyckeltal visas i läget Avancerat.</p>' : ''}${i.custom ? `<p style="margin-top:12px"><button class="btn danger sm" data-act="custom-del" data-inst="${esc(i.id)}">${ico('trash', 'icon sm')}Ta bort från appen</button></p>` : ''}</section>`;
  const o = (h, n) => h.replace('<section class="card"', `<section style="order:${n}" class="card"`);
  html += `<div class="grid2 reflow"><div class="stack">${o(chartCard, 1)}${o(hold, 3)}${o(world, 4)}${o(sensCard, 5)}</div><div class="stack">${o(sigCard, 2)}${o(about, 6)}</div></div>`;
  return html;
};
function factorRow(f) {
  const k = f.v > 0 ? 'p' : f.v < 0 ? 'n' : 'z';
  return `<div class="factor"><span class="fi ${k}" aria-hidden="true">${f.v > 0 ? '+' : f.v < 0 ? '−' : '•'}</span><div><b>${f.term ? term(f.term, f.title) : esc(f.title)}</b><p>${esc(f.text)}${f.link ? ` <a href="#${f.link}">Läs mer</a>` : ''}</p>${adv() && f.det ? `<div class="det">${esc(f.det)}</div>` : ''}</div></div>`;
}
const ev_isCompany = ev => !!ev.fx._bolag;
function effectOf(ev, i) {
  if (ev.fx._bolag) return ev.fx._bolag;
  if (ev.fx[i.sector]) return ev.fx[i.sector];
  if (ev.fx._utland && i.currency && i.currency !== 'SEK') return ev.fx._utland;
  return null;
}

    <div class="simgrid">${col('Kan gynnas', g.up, 'up')}${col('Kan missgynnas', g.down, 'down')}${g.mixed.length ? col('Osäkert, beror på utfallet', g.mixed, 'flat') : ''}${g.none.length ? `<div class="simcol"><h3>• Liten direkt påverkan</h3><p class="small ink2">${esc(g.none.map(i => i.name).join(', '))}</p></div>` : ''}</div>
    ${other.length ? `<p class="small ink2"><b>Andra branscher:</b> ${other.map(([k, v]) => `${esc(k)} ${v[0] > 0 ? '▲' : v[0] < 0 ? '▼' : '•'}`).join(' · ')}</p>` : ''}
    <div class="note">${ico('info', 'icon sm')}<span><strong>Exempel från verkligheten.</strong> ${esc(ev.example)}</span></div>
    <div class="note">${ico('compass', 'icon sm')}<span><strong>Att tänka på.</strong> ${esc(ev.calm)}</span></div>
    <p><button class="btn sm" data-act="ask" data-q="${esc('Förklara enkelt hur "' + ev.name + '" kan påverka mina innehav, och vad jag kan tänka på.')}">${ico('chat', 'icon sm')}Fråga Claude om det här</button></p></div></section>`;
  const RULES = [
    ['Sprid riskerna', 'Ha pengarna i flera bolag, branscher och länder. Många håller varje enskilt innehav under 10–20 %. En bred indexfond sprider risken automatiskt.'],
    ['Tänk i år, inte dagar', 'På kort sikt går börsen upp och ner nästan slumpmässigt. Över många år har breda index ändå stigit.'],

      <button class="btn" data-act="tour-go" data-k="0">Visa introduktionen igen</button>`;
  } else if (t === 'fraga') {
    const sug = ['Vad är skillnaden på en aktie och en fond?', 'Är min portfölj för riskfylld?', 'Hur påverkar oljepriset mina aktier?', 'Vad betyder köpsignal?'];
    body = `<div class="chat" id="chat">${S.chat.length ? S.chat.map(msgHtml).join('') : `<div class="msg a">Hej! Jag förklarar gärna allt om aktier, fonder och appen med enkla ord. Jag ser dina innehav och dagens nyheter. Vad undrar du?</div><div class="chips">${sug.map(q => `<button class="chip" data-act="ask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}</div>
      <p class="xs muted">Claude kan ha fel och ger inte personlig finansiell rådgivning. Frågorna använder din egen Claude-användning.</p>`;
  } else if (t === 'faq') body = FAQ().map(([q, a], j) => `<details class="faq" ${j < 1 ? 'open' : ''}><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
  else if (t === 'ord') body = `<label class="sr" for="hq">Sök i ordlistan</label><input id="hq" class="inp" type="search" placeholder="Sök ord" value="${esc(S.ui.hq)}" autocomplete="off"><div id="hglist">${glossList(S.ui.hq)}</div>`;
  else body = `<div><h3 style="margin-bottom:8px">Visa</h3><div class="modesw">${`<button type="button" data-act="mode" data-m="enkel" aria-pressed="${!adv()}">Enkelt</button><button type="button" data-act="mode" data-m="avancerat" aria-pressed="${adv()}">Avancerat</button>`}</div><p class="small ink2" style="margin-top:8px">Enkelt visar förklaringar i vardagsspråk. Avancerat visar även glidande medelvärden, RSI och nyckeltal.</p></div>
    <div><h3 style="margin-bottom:4px">Var sparas mina uppgifter?</h3><p class="small ink2">I den här webbläsaren, på den här enheten. Spara en säkerhetskopia ibland, och läs in den om du byter mobil eller vill se samma portfölj på datorn.</p><div class="chips" style="margin-top:10px"><button class="btn sm" data-act="export">Spara säkerhetskopia</button><label class="btn sm" for="importfile">Läs in säkerhetskopia</label><input type="file" id="importfile" accept="application/json,.json" hidden></div></div>
    <div><h3 style="margin-bottom:4px">Kursdata</h3><p class="small ink2">${S.meta?.pricesDemo ? 'Exempelkurser, påhittade för att visa hur appen fungerar.' : 'Från Yahoo Finance, fördröjda.'} Senast uppdaterade ${S.meta?.pricesUpdatedAt ? fmtDateY(S.meta.pricesUpdatedAt.slice(0, 10)) : '–'}.</p></div>`;
  $('#drawer').innerHTML = `<div class="dr-head"><h2 id="help-title">Hjälp</h2><button class="iconbtn" data-act="close-help" aria-label="Stäng hjälpen">${ico('x')}</button></div>
    <div class="dr-tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-act="help-tab" data-tab="${k}" aria-selected="${k === t}">${l}</button>`).join('')}</div>
    <div class="dr-body" id="drbody">${body}</div>
    ${t === 'fraga' ? `<form class="chatbox" id="chatform"><label class="sr" for="chatin">Din fråga</label><textarea id="chatin" rows="1" placeholder="Skriv din fråga …"></textarea>${S.chatCtl ? `<button type="button" class="btn" data-act="chat-stop" aria-label="Stoppa svaret">${ico('stop', 'icon sm')}</button>` : `<button class="btn primary" type="submit" aria-label="Skicka">${ico('send', 'icon sm')}</button>`}</form>` : ''}`;
  $('#drawer').tabIndex = -1;
  const f = $('#chatform'); if (f) {
    const ta = $('#chatin');
    f.addEventListener('submit', e => { e.preventDefault(); const v = ta.value.trim(); if (v && !S.chatCtl) { ta.value = ''; askClaude(v); } });
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
    const b = $('#drbody'); b.scrollTop = b.scrollHeight; if (!S.chatCtl) ta.focus();
  }
}
function glossList(q) { const L = GLOSS.filter(g => !q || (g[1] + ' ' + g[2]).toLowerCase().includes(q.toLowerCase())); return L.map(g => `<div class="gl"><b>${esc(g[1])}</b><p>${esc(g[2])}</p></div>`).join('') || '<p class="small ink2">Inget ord matchar.</p>'; }
function md(s) {
  const lines = esc(s).split('\n'); let out = '', ul = false;
  const inl = x => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<i>$2</i>');
  for (const l of lines) {
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!ul) { out += '<ul>'; ul = true; } out += `<li>${inl(m[1])}</li>`; continue; }
    if (ul) { out += '</ul>'; ul = false; }
    if (l.trim()) out += `<p>${inl(l.replace(/^#+\s*/, ''))}</p>`;
  }
  return out + (ul ? '</ul>' : '');
}
function msgHtml(m) {
  if (m.role === 'user') return `<div class="msg u">${esc(m.content)}</div>`;
  return `<div class="msg a">${m.pending && !m.content ? '<span class="thinking" aria-label="Claude tänker"><i></i><i></i><i></i>&nbsp;Tänker …</span>' : md(m.content)}${m.error ? `<div class="err">${esc(m.error)}</div>` : ''}</div>`;
}
function chatContext() {
  const P = S.P, b = latestBrief();
  const hold = P.open.length ? P.open.map(h => `- ${h.name} (${h.i?.sector || 'okänd bransch'}): ${fmt(h.qty, 0)} st, GAV ${fmtCur(h.avg, h.cur)}, kurs ${fmtCur(h.price, h.cur)}, vinst ${fmtPct(h.unrealPct)}, ${fmtPct(h.share * 100, 0, false)} av portföljen, signal: ${h.i ? (LEVELS[signalFor(h.i).level]?.label || 'ingen') : 'ingen'}`).join('\n') : 'Användaren har inga innehav inlagda.';
  const watch = (S.settings.watch || []).map(inst).filter(Boolean).map(i => `${i.name} (${LEVELS[signalFor(i).level]?.label || 'ingen signal'})`).join(', ');
  const cur = S.route.view === 'aktie' ? (inst(S.route.param)?.name || '') : '';
  return `Du är hjälpfunktionen i appen Börskompassen, en svensk app för att hålla koll på aktier och fonder.
Svara alltid på svenska, enkelt och kort (högst cirka 150 ord om användaren inte ber om mer), som till någon helt utan förkunskaper. Förklara facktermer direkt i texten. Använd korta stycken eller korta punktlistor.
Ge inga garantier om framtiden. Du får resonera om för- och nackdelar med att köpa eller sälja, men säg kort att det inte är personlig finansiell rådgivning när frågan gäller ett konkret köp eller en försäljning. Uppmuntra riskspridning, låga avgifter och långsiktighet. Uppmana aldrig till panikförsäljning.
${S.meta?.pricesDemo ? 'VIKTIGT: Kurserna och kursgraferna i appen är EXEMPELDATA, alltså påhittade. Nämn det om användaren frågar om kurser, kursutveckling eller signaler. Nyheterna i omvärldsanalysen är riktiga.\n' : ''}
Appens signaler: en regelbaserad sammanvägning av trend (kurs mot MA50/MA200), RSI (över 70 överköpt, under 30 översåld), senaste månadens utveckling och om dagens omvärldsanalys berör branschen. Skala: stark säljsignal, säljsignal, avvakta, köpsignal, stark köpsignal.

Användaren tittar just nu på: ${S.route.view}${cur ? ' (' + cur + ')' : ''}. Läge: ${adv() ? 'avancerat' : 'enkelt (nybörjare)'}.
Portföljens värde: ${fmtKr(P.total)}. Innehav:
${hold}
Bevakade: ${watch || 'inga'}.
${b ? `Senaste omvärldsanalys (${b.date}): ${b.title}. ${b.summary}\nHändelser: ${(b.items || []).map(it => `${it.title} [påverkar: ${(it.impacts || []).map(im => im.sector + (im.dir > 0 ? ' +' : im.dir < 0 ? ' −' : ' ?')).join(', ')}]`).join('; ')}` : ''}
Dagens datum: ${todayISO()}.`;
}
const SAMPLE_ERR = { not_granted: 'Du har inte gett appen lov att fråga Claude, så den funktionen är avstängd.', sampling_disabled: 'Claude är inte tillgänglig för ditt konto.', not_declared: 'Funktionen är inte tillgänglig.', capability_disabled: 'Funktionen är inte tillgänglig här.', capability_removed: 'Funktionen är inte tillgänglig här.', rate_limited: 'Claude har fått många frågor på kort tid. Vänta en stund och försök igen.', session_expired: 'Du behöver logga in igen.', refused: 'Claude kunde inte svara på den frågan. Försök formulera den på ett annat sätt.', empty_completion: 'Svaret blev tomt. Försök med en kortare fråga.', prompt_too_large: 'Frågan blev för lång. Korta ner den.' };
async function askClaude(q) {
  if (!S.sample || S.sampleOff || S.chatCtl) return;
  if ($('#helpwrap').hidden || S.ui.helpTab !== 'fraga') openHelp('fraga');
  S.chat.push({ role: 'user', content: q }); const reply = { role: 'assistant', content: '', pending: true }; S.chat.push(reply);
  if (S.chat.length > 16) S.chat.splice(0, S.chat.length - 16);
  const ctl = new AbortController(); S.chatCtl = ctl; renderHelp();
  const turns = [{ role: 'user', content: chatContext() }, ...S.chat.filter(m => m !== reply && m.content).map(m => ({ role: m.role, content: m.content }))];
  const bubble = () => { const c = $('#chat'); if (c && c.lastElementChild) { c.lastElementChild.outerHTML = msgHtml(reply); const b = $('#drbody'); b.scrollTop = b.scrollHeight; } };
  try {
    const r = await S.sample(turns, { cache: false, signal: ctl.signal, onText: ({ text }) => { reply.content = text; reply.pending = false; bubble(); } });
    reply.content = r.text; if (r.truncated) reply.error = 'Svaret blev avkortat. Be om en kortare förklaring.';
  } catch (e) {
    reply.content = e?.text || (e?.code === 'cancelled' ? 'Avbrutet.' : '');
    if (e?.code !== 'cancelled') reply.error = SAMPLE_ERR[e?.code] || 'Något gick fel på vägen. Försök igen om en stund.';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e?.code)) S.sampleOff = true;
  } finally { reply.pending = false; S.chatCtl = null; if (!$('#helpwrap').hidden) renderHelp(); }
}

/* =========================================================
   Popover, toast
   ========================================================= */
const pop = $('#pop');
function showTerm(el) {
  const g = GL[el.dataset.term]; if (!g) return;
  pop.innerHTML = `<b>${esc(g[1])}</b>${esc(g[2])}`; pop.hidden = false;
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(16, r.left), innerWidth - pw - 16), top = r.bottom + 8; if (top + ph > innerHeight - 16) top = r.top - ph - 8;
  pop.style.left = left + 'px'; pop.style.top = Math.max(16, top) + 'px'; S._popFor = el;
}
function closePop() { pop.hidden = true; S._popFor = null; }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3800); }

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#pop')) closePop(); return; }
  const a = el.dataset.act, d = el.dataset;
  if (a !== 'term') closePop();
  switch (a) {
    case 'help': e.preventDefault(); openHelp(d.tab); break;
    case 'close-help': closeHelp(); break;
    case 'help-tab': S.ui.helpTab = d.tab; renderHelp(); break;
    case 'close': closeDialog(); break;
    case 'term': e.preventDefault(); e.stopPropagation(); if (S._popFor === el) closePop(); else showTerm(el); break;
    case 'trade-new': tradeForm(null, d.inst); break;
    case 'trade-edit': { const t = S.trades.find(x => x.id === d.id); if (t) tradeForm(t); break; }
    case 'trade-del': { const t = S.trades.find(x => x.id === d.id); if (t) confirmDialog('Ta bort affären?', `${t.side === 'kop' ? 'Köpet' : 'Försäljningen'} av ${inst(t.inst)?.name || ''} den ${fmtDateY(t.date)} tas bort. Det går inte att ångra.`, 'Ta bort', () => { Store.del('trades', t.id); toast('Affären är borttagen.'); }); break; }
    case 'alert-new': alertForm(d.inst); break;
    case 'alert-del': Store.del('alerts', d.id); toast('Larmet är borttaget.'); break;
    case 'alert-toggle': { const al = S.alerts.find(x => x.id === d.id); if (al) Store.put('alerts', { ...al, on: al.on === false }); break; }
    case 'alert-quick': Store.put('alerts', { id: newId(), inst: d.inst, type: d.type, value: +d.value, on: true, createdAt: Date.now() }); toast('Larmet är skapat.'); break;
    case 'mark-read': Store.settings({ seen: [...new Set([...(S.settings.seen || []), ...S.N.map(n => n.key)])].slice(-300) }); break;
    case 'watch': { const w = new Set(S.settings.watch || []); const on = !w.has(d.inst); on ? w.add(d.inst) : w.delete(d.inst); Store.settings({ watch: [...w] }); toast(on ? 'Bevakas nu.' : 'Bevakas inte längre.'); break; }
    case 'price-set': priceForm(d.inst); break;
    case 'custom-new': customForm(); break;
    case 'custom-del': confirmDialog('Ta bort från appen?', 'Den egna aktien eller fonden tas bort. Affärer du registrerat för den ligger kvar i dagboken.', 'Ta bort', () => { Store.settings({ custom: (S.settings.custom || []).filter(c => c.id !== d.inst), watch: (S.settings.watch || []).filter(x => x !== d.inst) }); location.hash = 'marknad'; }); break;
    case 'range': S.ui.range = d.r; render(); break;
    case 'prange': S.ui.prange = d.r; render(); break;
    case 'mfilter': S.ui.mfilter = d.f; S.ui.mlimit = 0; render(); break;
    case 'mmore': S.ui.mlimit = (S.ui.mlimit || 100) + 100; render(); break;
    case 'sim': S.ui.sim = d.ev; render(); break;
    case 'example-load': loadExample(); break;
    case 'example-clear': clearExample(); break;
    case 'mode': Store.settings({ mode: d.m }); if (!$('#helpwrap').hidden) renderHelp(); break;
    case 'ask': if (S.sample && !S.sampleOff) askClaude(d.q); else { openHelp('faq'); toast('Frågefunktionen är inte tillgänglig här. Här är vanliga frågor i stället.'); } break;
    case 'chat-stop': S.chatCtl?.abort(); break;
    case 'export': Store.exportData(); break;
    case 'tour-go': tour(+d.k); break;
    case 'tour-skip': closeDialog(); Store.settings({ tourDone: true }); break;
    case 'tour-mode': closeDialog(); Store.settings({ mode: d.m, tourDone: true }); toast(d.m === 'enkel' ? 'Enkelt läge är på.' : 'Avancerat läge är på.'); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.ui.q = e.target.value; S.ui.mlimit = 0; render(); }
  else if (e.target.id === 'gq') { S.ui.gq = e.target.value; render(); }
  else if (e.target.id === 'hq') { S.ui.hq = e.target.value; $('#hglist').innerHTML = glossList(S.ui.hq); }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.classList || !d.classList.contains('wi')) return;
  if (!S.ui.wopen) S.ui.wopen = new Set($$('details.wi[open]').map(x => x.dataset.id));
  if (d.open) S.ui.wopen.add(d.dataset.id); else S.ui.wopen.delete(d.dataset.id);
}, true);
document.addEventListener('change', e => { if (e.target.id === 'importfile' && e.target.files[0]) { const f = e.target.files[0]; confirmDialog('Läsa in säkerhetskopian?', 'Affärerna, larmen och inställningarna i filen ersätter det som finns i den här webbläsaren nu.', 'Läs in', () => Store.importData(f)); e.target.value = ''; return; } if (e.target.id === 'briefsel') { S.ui.brief = +e.target.value; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!pop.hidden) closePop(); else if (!$('#helpwrap').hidden) closeHelp(); }
});
dlg.addEventListener('close', () => { if (!S.settings.tourDone && dlg.querySelector('.tour')) Store.settings({ tourDone: true }); });

/* =========================================================
   Boot
   ========================================================= */
$('#mk1').innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-4 8-8 4 4-8z" fill="currentColor"/><circle cx="12" cy="12" r="1.6" style="fill:var(--accent)"/></svg>`;
$('#mk2').innerHTML = $('#mk1').innerHTML;
S.route = parseRoute();
render();
Store.init();
})();
</script>
